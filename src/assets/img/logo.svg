<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Python LiDAR logo">
  <defs>
    <linearGradient id="lg-ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5b3df5"/>
      <stop offset="100%" stop-color="#18b6c4"/>
    </linearGradient>
    <radialGradient id="lg-core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#c7bdff"/>
      <stop offset="100%" stop-color="#5b3df5"/>
    </radialGradient>
  </defs>
  <!-- LiDAR scan rings -->
  <ellipse cx="32" cy="36" rx="26" ry="9" fill="none" stroke="url(#lg-ring)" stroke-width="2" opacity="0.55"/>
  <ellipse cx="32" cy="32" rx="22" ry="7.5" fill="none" stroke="url(#lg-ring)" stroke-width="2" opacity="0.75"/>
  <ellipse cx="32" cy="28" rx="17" ry="5.8" fill="none" stroke="url(#lg-ring)" stroke-width="2.2"/>
  <!-- Sensor / core -->
  <circle cx="32" cy="20" r="6.5" fill="url(#lg-core)" stroke="#3b1fb3" stroke-width="1.4"/>
  <!-- Scattered points -->
  <circle cx="10" cy="44" r="1.6" fill="#5b3df5"/>
  <circle cx="18" cy="49" r="1.6" fill="#18b6c4"/>
  <circle cx="28" cy="52" r="1.6" fill="#f59e0b"/>
  <circle cx="38" cy="50" r="1.6" fill="#2bb673"/>
  <circle cx="48" cy="46" r="1.6" fill="#5b3df5"/>
  <circle cx="54" cy="42" r="1.6" fill="#18b6c4"/>
  <circle cx="22" cy="42" r="1.2" fill="#18b6c4" opacity="0.7"/>
  <circle cx="44" cy="42" r="1.2" fill="#f59e0b" opacity="0.7"/>
</svg>
